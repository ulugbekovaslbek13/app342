<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Cyber Button</title>
    <style>
        body {
            background: #05070a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .cyber-btn {
            padding: 15px 40px;
            background: linear-gradient(45deg, #f85149, #58a6ff);
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.4);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .cyber-btn:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 0 35px rgba(248, 81, 73, 0.7);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <button class="cyber-btn">PUSH TO START</button>
</body>
</html>
